<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Development | Digital Solutions</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: white;
            color: #333;
            line-height: 1.6;
        }
        
        /* Navigation with Animations */
        nav {
            display: flex;
            justify-content: center;
            padding: 30px 0;
            background-color: white;
        }
        
        nav a {
            margin: 0 25px;
            text-decoration: none;
            color: #333;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
            position: relative;
            padding: 5px 0;
            transition: all 0.3s ease;
        }
        
        nav a:hover {
            color: #ff0000;
            transform: translateY(-3px);
        }
        
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #ff0000;
            transition: width 0.3s ease;
        }
        
        nav a:hover::after {
            width: 100%;
        }
        
        /* Hero Section */
        .hero {
            text-align: center;
            padding: 120px 20px;
            background-color: white;
        }
        
        .hero h1 {
            font-size: 64px; /* Larger title */
            margin-bottom: 25px;
            font-weight: 900; /* Extra bold */
            letter-spacing: 2px;
            color: #ff0000;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.3); /* Smooth glow */
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
            50% { text-shadow: 0 0 25px rgba(255, 0, 0, 0.5); }
            100% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        }
        
        .hero p {
            font-size: 22px;
            max-width: 700px;
            margin: 0 auto 50px;
            color: #666;
        }
        
        /* Stats Section */
        .stats {
            display: flex;
            justify-content: center;
            background-color: #f9f9f9;
            padding: 80px 20px;
            text-align: center;
        }
        
        .stat-item {
            margin: 0 40px;
            transition: transform 0.3s;
        }
        
        .stat-item:hover {
            transform: scale(1.05);
        }
        
        .stat-item h2 {
            font-size: 42px;
            color: #ff0000;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .stat-item p {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666;
            font-weight: 600;
        }
        
        /* CTA Buttons */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(to right, #ff0000, #ff4500);
            color: white;
            padding: 18px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3);
            border: none;
        }
        
        .contact-button {
            background: linear-gradient(to right, #ff0000, #cc0000);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
            to { box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); }
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Work</a>
        <a href="#">Services</a>
        <a href="#">Testimonials</a>
        <a href="#">Contact</a>
    </nav>
    
    <!-- Hero Section -->
    <section class="hero">
        <h1>PULSE DEVELOPMENT</h1>
        <p>Transform your ideas into powerful digital solutions that engage your audience and elevate your business.</p>
        <div class="button-container">
            <a href="#" class="cta-button">Let's create something amazing</a>
            <a href="#" class="cta-button contact-button">Contact Us</a>
        </div>
    </section>
    
    <!-- Stats Section -->
    <section class="stats">
        <div class="stat-item">
            <h2>5+</h2>
            <p>Years Experience</p>
        </div>
        <div class="stat-item">
            <h2>120+</h2>
            <p>Projects Completed</p>
        </div>
        <div class="stat-item">
            <h2>40+</h2>
            <p>Happy Clients</p>
        </div>
        <div class="stat-item">
            <h2>8</h2>
            <p>Industry Awards</p>
        </div>
    </section>
</body>
</html>
