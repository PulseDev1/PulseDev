<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Development | Digital Solutions</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: white;
            line-height: 1.6;
        }
        
        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            padding: 20px 0;
            background-color: transparent;
        }
        
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: opacity 0.3s;
        }
        
        nav a:hover {
            opacity: 0.8;
        }
        
        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px 100px;
            background: linear-gradient(135deg, #0066ff, #00ccff);
        }
        
        .hero h1 {
            font-size: 48px; /* Exact DESIGNX title size */
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ff0000, #ff6666); /* Red gradient */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .hero p {
            font-size: 20px; /* DESIGNX text size */
            max-width: 600px;
            margin: 0 auto 40px;
            opacity: 0.9;
        }
        
        /* Stats Section */
        .stats {
            display: flex;
            justify-content: center;
            background-color: white;
            padding: 50px 20px;
            text-align: center;
        }
        
        .stat-item {
            margin: 0 25px;
        }
        
        .stat-item h2 {
            font-size: 36px; /* DESIGNX stat size */
            color: #ff0000; /* Red numbers */
            margin-bottom: 5px;
        }
        
        .stat-item p {
            font-size: 14px; /* DESIGNX stat text size */
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }
        
        /* CTA Button */
        .cta-button {
            display: inline-block;
            background: linear-gradient(to right, #ff0000, #ff6666); /* Red gradient button */
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            border: none;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#">Work</a>
        <a href="#">Services</a>
        <a href="#">Testimonials</a>
        <a href="#">Contact</a>
    </nav>
    
    <!-- Hero Section -->
    <section class="hero">
        <h1>PULSE DEVELOPMENT</h1>
        <p>Transform your ideas into powerful digital solutions that engage your audience and elevate your business.</p>
        <a href="#" class="cta-button">Let's create something amazing</a>
    </section>
    
    <!-- Stats Section -->
    <section class="stats">
        <div class="stat-item">
            <h2>5+</h2>
            <p>Years Experience</p>
        </div>
        <div class="stat-item">
            <h2>120+</h2>
            <p>Projects Completed</p>
        </div>
        <div class="stat-item">
            <h2>40+</h2>
            <p>Happy Clients</p>
        </div>
        <div class="stat-item">
            <h2>8</h2>
            <p>Industry Awards</p>
        </div>
    </section>
</body>
</html>
