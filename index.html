<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Button with Discord Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #e60012;
      --black: #121212;
      --white: #ffffff;
      --dark-gray: #1e1e1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: linear-gradient(135deg, #0e0e0e, #2a2a2a);
      color: var(--white);
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: var(--black);
    }

    .logo img {
      height: 60px;
      margin-right: 10px;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      margin: 0 15px;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--red);
      transition: width 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 100px 20px;
      background-image: url('https://images.unsplash.com/photo-1605902711622-cfb43c4437b2?auto=format&fit=crop&w=1500&q=80');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      position: relative;
      color: var(--white);
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      max-width: 600px;
      margin: 0 auto 30px;
    }

    .btn {
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      background: var(--red);
      color: var(--white);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: inline-block;
      text-decoration: none;
      user-select: none;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px var(--red);
    }

    /* Services */
    .services {
      padding: 60px 20px;
      background: var(--dark-gray);
      text-align: center;
    }

    .services h2 {
      font-size: 36px;
      color: var(--red);
      margin-bottom: 30px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: auto;
    }

    .service {
      background: var(--black);
      padding: 20px;
      border-radius: 10px;
      transition: transform 0.3s;
    }

    .service:hover {
      transform: translateY(-5px);
    }

    .service img {
      width: 50px;
      margin-bottom: 15px;
    }

    .service h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .service p {
      font-size: 14px;
      color: #ccc;
    }

    /* Footer */
    footer {
      background: #111;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <!-- Put your logo here -->
      <img src="https://via.placeholder.com/150x60?text=Logo" alt="Logo" />
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Services</a>
      <a href="#">About</a>
      <a href="https://discord.gg/AxhcFukBzx" target="_blank" rel="noopener" class="btn">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to Our Site</h1>
      <p>Your awesome tagline goes here.</p>
      <a href="https://discord.gg/AxhcFukBzx" target="_blank" rel="noopener" class="btn">Contact</a>
    </div>
  </section>

  <section class="services">
    <h2>Our Services</h2>
    <div class="service-grid">
      <div class="service">
        <img src="https://via.placeholder.com/50" alt="Service 1" />
        <h3>Service One</h3>
        <p>Description for service one.</p>
      </div>
      <div class="service">
        <img src="https://via.placeholder.com/50" alt="Service 2" />
        <h3>Service Two</h3>
        <p>Description for service two.</p>
      </div>
      <div class="service">
        <img src="https://via.placeholder.com/50" alt="Service 3" />
        <h3>Service Three</h3>
        <p>Description for service three.</p>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 Your Company Name. All rights reserved.
  </footer>

</body>
</html>
