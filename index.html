<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Development | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a2e0e6fdd6.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --red: #e60012;
      --black: #121212;
      --white: #ffffff;
      --dark-gray: #1e1e1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0e0e0e, #2a2a2a);
      color: var(--white);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background: var(--black);
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .logo img {
      height: 60px;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--red);
      transition: width 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    .hero {
      text-align: center;
      padding: 120px 20px 100px;
      background: url('https://images.unsplash.com/photo-1605902711622-cfb43c4437b2?auto=format&fit=crop&w=1500&q=80') center/cover no-repeat;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
      animation: slideFadeIn 1.2s ease-out forwards;
      opacity: 0;
      transform: translateY(-40px);
    }

    .hero p {
      font-size: 20px;
      max-width: 600px;
      margin: 0 auto 30px;
      animation: fadeIn 1.5s ease forwards;
      opacity: 0;
    }

    @keyframes slideFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .service-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .btn {
      background: var(--red);
      color: var(--white);
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px #e60012aa;
    }

    .btn i {
      font-size: 18px;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 14px var(--red);
    }

    /* Floating Contact Button */
    .contact-fab {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 60px;
      height: 60px;
      background-color: var(--red);
      color: var(--white);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      font-size: 22px;
      box-shadow: 0 0 15px #e60012cc;
      animation: pulse 2s infinite;
      transition: transform 0.3s;
      z-index: 999;
    }

    .contact-fab:hover {
      transform: scale(1.1);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 10px var(--red); }
      50% { box-shadow: 0 0 20px var(--red); }
      100% { box-shadow: 0 0 10px var(--red); }
    }

    footer {
      background: #111;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      margin-top: 100px;
    }

    @media(max-width: 600px) {
      .btn {
        width: 90%;
        justify-content: center;
      }

      .hero h1 {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Pulse Development" />
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="https://discord.gg/AxhcFukBzx" target="_blank">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to Pulse Development</h1>
      <p>Custom services for Roblox, Discord, automation tools, bots, and secure exchanges.</p>

      <div class="service-buttons">
        <a href="roblox.html" class="btn"><i class="fab fa-roblox"></i> Roblox Services</a>
        <a href="discord.html" class="btn"><i class="fab fa-discord"></i> Discord Services</a>
        <a href="bots.html" class="btn"><i class="fas fa-robot"></i> Bot Services</a>
        <a href="exe-tools.html" class="btn"><i class="fas fa-cogs"></i> EXE Tools</a>
        <a href="exchange.html" class="btn"><i class="fas fa-exchange-alt"></i> Exchanges</a>
        <a href="https://discord.gg/AxhcFukBzx" class="btn" target="_blank"><i class="fas fa-file-contract"></i> Terms of Service</a>
      </div>
    </div>
  </section>

  <!-- Contact Floating Button -->
  <a href="https://discord.gg/AxhcFukBzx" target="_blank" class="contact-fab" title="Contact Us">
    <i class="fas fa-envelope"></i>
  </a>

  <!-- Footer -->
  <footer>
    &copy; 2025 Pulse Development. All rights reserved.
  </footer>

</body>
</html>
